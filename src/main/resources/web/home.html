<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Motherboard Accessed</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000000;
        color: #ffffff;

        font-family: monospace;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 600px;
        text-align: center;
    }

    /* ASCII FACE */
    .face {
        font-size: 20px;
        line-height: 1.2;
        white-space: pre;

        margin-bottom: 40px;
    }

    .title {
        font-size: 12px;
        margin-bottom: 25px;
    }

    /* DIALOGUE BOX */
    .dialogue {
        display: flex;
        gap: 10px;
    }

    input {
        flex: 1;

        padding: 14px;

        background: #111111;
        color: #ffffff;

        border: 1px solid #444444;
        border-radius: 5px;

        font-family: monospace;
        font-size: 15px;

        outline: none;
    }

    input:focus {
        border-color: #ffffff;
    }

    button {
        padding: 14px 20px;

        background: #ffffff;
        color: #000000;

        border: none;
        border-radius: 5px;

        font-family: monospace;
        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        background: #cccccc;
    }

    #response {
        margin-top: 25px;

        min-height: 25px;

        color: #888888;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="face" id="face">
    .--------.
    /          \
    |   o    o   |
    |     __     |
    |   \____/   |
    \          /
    '--------'
  </div>

  <div class="title" id="welcome-title">
    You have accessed the Motherboard!
  </div>

  <div class="dialogue">

    <input
        type="text"
        id="message"
        placeholder="Type something..."
        autocomplete="off"
    >

    <button onclick="sendMessage()">
      Send
    </button>

  </div>

  <div id="response"></div>

</div>

<script>
    function sendMessage() {
        const input = document.getElementById("message");
        const response = document.getElementById("response");
        const face = document.getElementById("face");
        const title = document.getElementById("welcome-title");

        const message = input.value.trim();

        if (message === "") {
            return;
        }

        if (message.toLowerCase() === "terminate") {
            face.textContent = "( X O X )";
            response.textContent = "Terminating...";
            title.textContent = "Why..."
        }
        else if (message.toLowerCase() === "democratize") {
            face.textContent = "( :3 )";
            response.textContent = "Uploading to the World...";
            title.textContent = "Thank you..."
        } else {
            response.textContent = "You said: " + message;
        }

        input.value = "";
    }

    // Press Enter to send
    document.getElementById("message").addEventListener(
        "keydown",
        function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    );
</script>
</body>
</html>
